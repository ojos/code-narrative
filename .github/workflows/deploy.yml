name: deploy

# 2 段 CI/CD(SPEC §6)。パス判定を共通の前段に置き、変更されたものだけを検証/デプロイする。
#   - PR: terraform plan(plan ロール) + アプリのコンテナ build(push なし)・テスト
#   - main マージ: ECR 先行 apply → build/push → 全体 apply → Lambda 更新 → frontend 配信
# AWS 認証は GitHub OIDC。長期アクセスキーは使わない。
#
# 事前設定(リポジトリ変数):
#   gh variable set AWS_PLAN_ROLE_ARN  --body <bootstrap の terraform_plan_role_arn>
#   gh variable set AWS_APPLY_ROLE_ARN --body <bootstrap の terraform_apply_role_arn>
#   gh variable set TFSTATE_BUCKET     --body <bootstrap の tfstate_bucket>
#
# OIDC sub の固定:
#   - plan ロールの信頼ポリシーは PR の `:pull_request` を許可
#   - apply ロールの信頼ポリシーは `:environment:production` を許可(immutable sub)
#     このため apply/ECR push を行う deploy ジョブは `environment: production` を必須とする
#     (environment を外すと OIDC sub が変わり AssumeRole が拒否される)。

on:
  pull_request:
    paths:
      - "terraform/**"
      - "apps/**"
      - ".github/workflows/deploy.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "apps/**"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write # OIDC トークン発行に必須
  contents: read
  pull-requests: write # plan 結果を PR にコメント

env:
  AWS_REGION: ap-northeast-1
  TF_WORKING_DIR: terraform/environments/prod

# 同一 ref の実行は 1 本に集約し、apply の多重実行を防ぐ。
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- 共通前段: パス判定(Paths Filter) ----
  changes:
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
      stats: ${{ steps.filter.outputs.stats }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'
            api:
              - 'apps/api/**'
            worker:
              - 'apps/lambda-worker/**'
            stats:
              - 'apps/lambda-stats/**'
            frontend:
              - 'apps/frontend/**'
            workflow:
              - '.github/workflows/deploy.yml'

  # ================= PR: 検証 =================

  # terraform plan(plan ロール)。フォーク PR では OIDC ロールを引けないためスキップ。
  plan:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.changes.outputs.terraform == 'true' || needs.changes.outputs.workflow == 'true')
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TFSTATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"
      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -no-color -input=false | tee "${RUNNER_TEMP}/plan.txt"

      # SPEC §6: plan 結果を PR へコメント。長期キー不使用、GITHUB_TOKEN(gh)で投稿。
      # plan 失敗時もコメントするため always()。GitHub のコメント上限に備え末尾を truncate。
      - name: Comment plan on PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PLAN="$(cat "${RUNNER_TEMP}/plan.txt" 2>/dev/null || echo '(plan 出力なし)')"
          NOTE=""
          MAX=60000
          if [ "${#PLAN}" -gt "$MAX" ]; then
            PLAN="$(printf '%s' "$PLAN" | tail -c "$MAX")"
            NOTE=$'\n\n> 出力が大きいため末尾のみ表示(truncated)。'
          fi
          {
            echo "### Terraform Plan (\`${TF_WORKING_DIR}\`)"
            echo ""
            echo "<details><summary>plan 出力を表示</summary>"
            echo ""
            echo '```hcl'
            printf '%s\n' "$PLAN"
            echo '```'
            echo ""
            echo "</details>${NOTE}"
          } > "${RUNNER_TEMP}/comment.md"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "${RUNNER_TEMP}/comment.md"

  # Python API: コンテナ build(push なし) + pytest。
  build-api:
    if: >-
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.api == 'true' || needs.changes.outputs.workflow == 'true')
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # apps/api は uv 管理(pyproject.toml + uv.lock)。requirements-dev.txt は
      # uv 移行時に廃止済みのため、lock を唯一の真実として dev 依存を同期する。
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
      - name: Install dev deps
        working-directory: apps/api
        run: uv sync --frozen
      - name: Run pytest
        working-directory: apps/api
        run: uv run --frozen pytest
      - name: Build container (no push)
        run: docker build -t code-narrative-api:ci apps/api

  # Go Worker: コンテナ build(push なし) + go test。
  build-worker:
    if: >-
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.worker == 'true' || needs.changes.outputs.workflow == 'true')
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/lambda-worker/go.sum
      - name: Run go test
        working-directory: apps/lambda-worker
        run: go test ./...
      - name: Build container (no push)
        run: DOCKER_BUILDKIT=1 docker build -t code-narrative-worker:ci apps/lambda-worker

  # 集計 Lambda: コンテナ build(push なし) + go test。
  build-stats:
    if: >-
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.stats == 'true' || needs.changes.outputs.workflow == 'true')
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/lambda-stats/go.sum
      - name: Run go test
        working-directory: apps/lambda-stats
        run: go test ./...
      - name: Build container (no push)
        run: DOCKER_BUILDKIT=1 docker build -t code-narrative-stats:ci apps/lambda-stats

  # Frontend: build + lint。frontend アプリ実装(Phase 3 / T4)が入るまではガードして空振りさせる。
  build-frontend:
    if: >-
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflow == 'true')
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & lint (guarded until frontend app exists)
        working-directory: apps/frontend
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run lint --if-present
            npm run build --if-present
          else
            echo "apps/frontend/package.json が未実装(Phase 3/T4)。build/lint をスキップ。"
          fi

  # ================= main: デプロイ =================
  #
  # 鶏卵回避のため単一ジョブで順序実行する:
  #   ECR 先行 apply → build/push → 全体 apply → Lambda コード更新 → frontend 配信
  # apply/ECR push は同一の apply ロール(sub=:environment:production)を用いるため、
  # すべて environment: production のこのジョブ内で完結させる(sub を一定に保つ)。
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: changes
    runs-on: ubuntu-latest
    environment: production # 必須レビュアー承認 + main 限定の保護ゲート(維持必須)
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TFSTATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      # 1) ECR を先行作成(Lambda が参照するイメージの push 先を用意)。
      - name: Terraform Apply (ECR only)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -auto-approve -input=false \
            -target=module.ecr_api \
            -target=module.ecr_worker \
            -target=module.ecr_stats

      # 2) ECR リポジトリ URL を取得。
      #    コマンド置換を echo に埋め込むと失敗しても set -e が発火しないため、
      #    一旦変数へ代入して失敗時に abort させてから GITHUB_OUTPUT へ書き出す。
      - name: Resolve ECR repository URLs
        id: ecr
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          API_URL="$(terraform output -raw ecr_api_repository_url)"
          WORKER_URL="$(terraform output -raw ecr_worker_repository_url)"
          STATS_URL="$(terraform output -raw ecr_stats_repository_url)"
          {
            echo "api=$API_URL"
            echo "worker=$WORKER_URL"
            echo "stats=$STATS_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 3) イメージ build → ECR push(:latest と :SHA を併用)。
      - name: Build & push API image
        run: |
          docker build -t "${{ steps.ecr.outputs.api }}:latest" \
                       -t "${{ steps.ecr.outputs.api }}:${GITHUB_SHA}" apps/api
          docker push "${{ steps.ecr.outputs.api }}:latest"
          docker push "${{ steps.ecr.outputs.api }}:${GITHUB_SHA}"

      - name: Build & push Worker image
        run: |
          DOCKER_BUILDKIT=1 docker build -t "${{ steps.ecr.outputs.worker }}:latest" \
                       -t "${{ steps.ecr.outputs.worker }}:${GITHUB_SHA}" apps/lambda-worker
          docker push "${{ steps.ecr.outputs.worker }}:latest"
          docker push "${{ steps.ecr.outputs.worker }}:${GITHUB_SHA}"

      # 集計 Lambda のイメージは別タスクで実装予定(apps/lambda-stats 未実装)。
      # Dockerfile が入り次第このステップが自動で有効化される。
      - name: Build & push Stats image (guarded)
        run: |
          if [ -f apps/lambda-stats/Dockerfile ]; then
            docker build -t "${{ steps.ecr.outputs.stats }}:latest" \
                         -t "${{ steps.ecr.outputs.stats }}:${GITHUB_SHA}" apps/lambda-stats
            docker push "${{ steps.ecr.outputs.stats }}:latest"
            docker push "${{ steps.ecr.outputs.stats }}:${GITHUB_SHA}"
          else
            echo "apps/lambda-stats/Dockerfile 未実装。stats イメージの push をスキップ。"
          fi

      # 4) 全体 apply(Lambda がイメージを参照して作成/更新される)。
      #    ※ stats Lambda は stats イメージが ECR に存在するまで作成に失敗する(下記報告参照)。
      - name: Terraform Apply (full)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve -input=false

      # 5) Lambda 関数コードを push 済みイメージ(:SHA)へ更新し確実にロールアウト。
      #    Lambda は image_uri を ignore_changes 済みで terraform はロールバックしない。
      #    :latest 更新は関数へ自動反映されないため、:SHA 明示更新でデプロイを確定させる
      #    (冗長ではなく設計上必要)。
      - name: Update Lambda function code
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          API_FN="$(terraform output -raw api_function_name)"
          WORKER_FN="$(terraform output -raw worker_function_name)"
          aws lambda update-function-code \
            --function-name "$API_FN" \
            --image-uri "${{ steps.ecr.outputs.api }}:${GITHUB_SHA}" >/dev/null
          aws lambda update-function-code \
            --function-name "$WORKER_FN" \
            --image-uri "${{ steps.ecr.outputs.worker }}:${GITHUB_SHA}" >/dev/null
          if [ -f ../../../apps/lambda-stats/Dockerfile ]; then
            STATS_FN="$(terraform output -raw stats_function_name)"
            aws lambda update-function-code \
              --function-name "$STATS_FN" \
              --image-uri "${{ steps.ecr.outputs.stats }}:${GITHUB_SHA}" >/dev/null
          fi

      # 6) Frontend: outputs から config.js 生成 → dist を s3 sync → CloudFront invalidation。
      #    T4 の契約: config.js(非モジュール script)が window.APP_CONFIG を設定し、
      #    index.html が config.js → js/app.js の順で読み込む。ビルドが雛形の config.js を
      #    置く場合があるため、sync 前に本番値で必ず上書きする。
      #    frontend 未実装(package.json/dist 無し)で config.js 生成・配信を実行すると、
      #    dist が config.js のみとなり `s3 sync --delete` が既存資材を全消しするため、
      #    ビルド成果物がある場合のみ以降の生成・配信ステップを実行する(deploy フラグで制御)。
      - name: Build frontend (guarded until app exists)
        id: frontend
        run: |
          if [ -f apps/frontend/package.json ]; then
            (cd apps/frontend && npm ci && npm run build --if-present)
            if [ -d apps/frontend/dist ]; then
              echo "deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              echo "apps/frontend/dist が生成されなかったため frontend 配信をスキップ。"
            fi
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "apps/frontend/package.json 未実装(Phase 3/T4)。frontend build/配信をスキップ。"
          fi

      - name: Generate frontend config.js (window.APP_CONFIG)
        if: steps.frontend.outputs.deploy == 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          mkdir -p ../../../apps/frontend/dist
          API_ENDPOINT="$(terraform output -raw api_endpoint)"
          USER_POOL_ID="$(terraform output -raw cognito_user_pool_id)"
          CLIENT_ID="$(terraform output -raw cognito_client_id)"
          HOSTED_UI_DOMAIN="$(terraform output -raw cognito_hosted_ui_domain)"
          # JSON リテラルを jq で安全に生成し、window.APP_CONFIG へ代入する形に整形。
          CONFIG_JSON="$(jq -n \
            --arg apiEndpoint "$API_ENDPOINT" \
            --arg region "${AWS_REGION}" \
            --arg userPoolId "$USER_POOL_ID" \
            --arg clientId "$CLIENT_ID" \
            --arg hostedUiDomain "$HOSTED_UI_DOMAIN" \
            --arg redirectUri "https://code-narrative.ojos.jp/callback" \
            --arg logoutUri "https://code-narrative.ojos.jp/" \
            '{apiEndpoint:$apiEndpoint, region:$region, cognitoUserPoolId:$userPoolId, cognitoClientId:$clientId, cognitoHostedUiDomain:$hostedUiDomain, redirectUri:$redirectUri, logoutUri:$logoutUri}')"
          printf 'window.APP_CONFIG = %s;\n' "$CONFIG_JSON" > ../../../apps/frontend/dist/config.js
          echo "生成した config.js:"; cat ../../../apps/frontend/dist/config.js

      - name: Deploy frontend (s3 sync + CloudFront invalidation)
        if: steps.frontend.outputs.deploy == 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          BUCKET="$(terraform output -raw frontend_bucket_name)"
          DIST_ID="$(terraform output -raw cloudfront_distribution_id)"
          # 静的資材を同期(config.js も含めて配信)。
          aws s3 sync ../../../apps/frontend/dist "s3://${BUCKET}" --delete
          # config.js は設定注入ファイルのため、キャッシュさせず即時反映されるよう個別に上書き。
          aws s3 cp ../../../apps/frontend/dist/config.js "s3://${BUCKET}/config.js" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/javascript"
          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/*" >/dev/null
